name: G0 quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-g0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-g0.lock
      - name: Install G0 validator dependency
        run: python -m pip install --require-hashes -r backend/requirements-g0.lock
      - name: Resolve committed-change safety baseline
        id: safety_base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          candidate="$PUSH_BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            candidate="$PR_BASE_SHA"
          fi
          if [ -z "$candidate" ] || [ "$candidate" = "0000000000000000000000000000000000000000" ]; then
            candidate="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "base_ref=$candidate" >> "$GITHUB_OUTPUT"
      - name: Reject committed file deletion or rename
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/safety_scan.py --root .
          --base-ref "${{ steps.safety_base.outputs.base_ref }}"
      - name: Run safety, architecture, contract, and unit gates
        run: make verify-g0
