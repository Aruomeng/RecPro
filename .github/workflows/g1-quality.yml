name: G1 runnable skeleton quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-g1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          clean: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-g0.lock
            backend/requirements-g1.lock
            backend/requirements-g1-test.lock
      - name: Install hash-locked Python dependencies
        run: >-
          python -m pip install --require-hashes
          -r backend/requirements-g0.lock
          -r backend/requirements-g1.lock
          -r backend/requirements-g1-test.lock
      - name: Set up active-LTS Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies in the fresh runner
        run: npm ci --ignore-scripts --prefix frontend
      - name: Run local G1 safety, contract, backend, and frontend gates
        run: >-
          make verify-g1-local PYTHON=python
          BUILD_RUN_ID=ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate Compose without creating containers or volumes
        run: make compose-config
