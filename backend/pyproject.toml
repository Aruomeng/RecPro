[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libramas-backend"
version = "0.1.0"
description = "LibraMAS smart-library multi-agent recommendation prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "asyncmy==0.2.11",
    "cryptography==47.0.0",
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
g0 = ["jsonschema==4.26.0", "PyYAML==6.0.3"]
g1-test = ["httpx2==2.9.1"]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
