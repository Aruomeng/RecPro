[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libramas-backend"
version = "0.1.0"
description = "LibraMAS smart-library multi-agent recommendation prototype"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
g0 = ["jsonschema==4.26.0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
