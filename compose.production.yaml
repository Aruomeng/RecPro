# Hardened single-host overlay.  This file is intentionally not included by
# the default Compose command.  Before any deployment, run the pure
# production gate and obtain separate approvals for OIDC mapping, TLS assets,
# database identities, backups and any new container/volume.
name: "${COMPOSE_PROJECT_NAME:?set_a_unique_lowercase_project_name}"

services:
  mysql:
    # Keep database ports private to the Compose network in production.
    ports: !reset []

  neo4j:
    # The default Neo4j service is not a research read identity.  Production
    # must point the application at the separately approved read-only replica;
    # no administrator fallback is configured by this overlay.
    ports: !reset []

  backend:
    environment:
      RECPRO_APP_ENV: "production"
      RECPRO_PRODUCTION_HTTP_ENABLED: "true"
      RECPRO_AUTH_ENABLED: "true"
      RECPRO_AUTH_MODE: "oidc"
      RECPRO_AUTH_COOKIE_SECURE: "true"
      RECPRO_BACKGROUND_PLANNING_ENABLED: "false"
      RECPRO_BACKGROUND_PLANNING_PROVIDER: "disabled"
      RECPRO_WORKER_ENABLED: "false"
      RECPRO_WORKER_MODE: "disabled"
    ports: !reset []
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - "/tmp"

  frontend:
    ports: !reset []
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - "/tmp"
      - "/var/cache/nginx"
      - "/var/run"

  edge:
    image: "nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "0.0.0.0:${RECPRO_HTTPS_HOST_PORT:-8443}:8443"
    volumes:
      - "./infra/proxy/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${RECPRO_TLS_CERT_FILE:?set_RECPRO_TLS_CERT_FILE}:/run/tls/tls.crt:ro"
      - "${RECPRO_TLS_KEY_FILE:?set_RECPRO_TLS_KEY_FILE}:/run/tls/tls.key:ro"
    read_only: true
    tmpfs:
      - "/tmp"
      - "/var/cache/nginx"
      - "/var/run"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget --no-check-certificate --quiet --spider
          https://127.0.0.1:8443/healthz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-plane

